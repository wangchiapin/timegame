<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ebe5d6">
<title>練習時間 · ¿Qué hora es?</title>
<style>
:root{
  --bg:#ebe5d6; --card:#f6f2e8; --card2:#efe9db; --ink:#2b2a27; --sub:#6d675a; --line:#c4baa3;
  --accent:#4c5a4b; --ok:#4f7a54; --okbg:#dfe9d6; --bad:#a8503c; --badbg:#f1dcd3; --hl:#e6d6a6; --red:#a8503c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.5}
body{min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:560px;margin:0 auto;padding:12px 14px 90px}
h1,h2,h3{margin:0;font-weight:600}
.small{font-size:13px;color:var(--sub)}
.tr{display:block;font-size:13px;color:var(--sub);line-height:1.35;font-weight:400}
.tr.inline{display:inline;margin-left:6px}

/* 字＋拼音／注音 */
.ch{display:inline-flex;flex-direction:column;align-items:center;margin:0 1px;vertical-align:bottom}
.ch .h{line-height:1.25}
.ch .ph{font-size:.5em;line-height:1.15;color:var(--sub);white-space:nowrap;min-height:1.15em;font-weight:400}
.ch.np{margin:0}

/* 版面 */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-height:44px;text-align:center}
.btn:active{background:var(--card2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#f6f2e8}
.btn.primary:active{filter:brightness(.92)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.wide{width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{flex:1;border:0;border-right:1px solid var(--line);background:transparent;padding:8px 4px;font-size:14px;min-height:40px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#f6f2e8}
.setrow{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;margin:8px 0}
.setrow label{font-size:13px;color:var(--sub);line-height:1.25}
input[type=text]{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;background:#fbf9f3;color:var(--ink)}

/* 開始畫面 */
.title{text-align:center;padding:10px 0 4px}
.title h1{font-size:30px;letter-spacing:.12em}
.title .sub{color:var(--sub);font-size:14px;margin-top:2px}
.mixbtn{display:block;width:100%;text-align:left;padding:14px;border:1px solid var(--accent);border-radius:10px;background:var(--card);margin:10px 0}
.mixbtn b{font-size:19px}
.unit{border:1px solid var(--line);border-radius:10px;background:var(--card);margin:8px 0;overflow:hidden}
.unit>button.uh{width:100%;text-align:left;background:transparent;border:0;padding:12px 14px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.unit>button.uh b{font-size:17px}
.unit .subs{display:none;border-top:1px solid var(--line);padding:6px 10px 10px;background:var(--card2)}
.unit.open .subs{display:block}
.unit .subs .btn{display:block;width:100%;text-align:left;margin:6px 0;padding:9px 12px}
.unit .subs .btn.mixu{border-color:var(--accent)}
.arrow{color:var(--sub);transition:transform .15s}
.unit.open .arrow{transform:rotate(90deg)}

/* 遊戲畫面 */
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.bar .btn{min-height:38px;padding:6px 12px}
.prog{height:5px;background:var(--card2);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:8px}
.prog i{display:block;height:100%;background:var(--accent)}
.instr{font-size:14px;color:var(--sub)}
.qline{font-size:26px;margin:6px 0 2px;text-align:center}
.qline .tr{font-size:13px;margin-top:2px}
.vis{margin:8px 0;text-align:center}
.vis .datebox{display:inline-block;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;font-size:19px;margin-bottom:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.opts.one{grid-template-columns:1fr}
.opt{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 8px;min-height:64px;font-size:20px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.opt .badge{font-size:15px;color:var(--sub);font-variant-numeric:tabular-nums}
.opt .tr{font-size:12px}
.opt svg{width:100%;max-width:150px;height:auto}
.opt:active{background:var(--card2)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt.sel{background:var(--hl)}
.opt[disabled]{cursor:default}
.hearbar{display:flex;gap:8px;justify-content:center;margin:6px 0;flex-wrap:wrap}
.peek{text-align:center;margin:6px 0;font-size:22px}
.fb{border-radius:10px;padding:12px 14px;margin:10px 0;border:1px solid var(--line);background:var(--card)}
.fb.ok{background:var(--okbg);border-color:var(--ok)}
.fb.bad{background:var(--badbg);border-color:var(--bad)}
.fb .big{font-weight:600;font-size:17px}
.fb .ans{font-size:22px;margin:4px 0}
.fb .why{font-size:14px;margin-top:6px}
.foot{display:flex;justify-content:center;margin-top:10px}
.foot .btn{min-width:180px}

/* 時鐘 */
svg.clock{display:block;margin:6px auto;width:min(74vw,250px);height:auto;touch-action:none;user-select:none}
svg.clock.mini{width:100%;max-width:140px;margin:0 auto}
.digi{font-variant-numeric:tabular-nums;font-size:24px;letter-spacing:.04em}
.dialread{text-align:center;margin:2px 0;color:var(--sub);font-size:14px}

/* 月曆 */
.cal{margin:6px auto;max-width:440px}
.cal .ct{text-align:center;font-size:16px;margin-bottom:4px;color:var(--ink)}
.cal table{width:100%;border-collapse:collapse;table-layout:fixed;background:var(--card)}
.cal th{font-weight:500;font-size:14px;padding:4px 0;border:1px solid var(--line);background:var(--card2)}
.cal th.we,.cal td.we .n{color:var(--red)}
.cal td{border:1px solid var(--line);height:52px;vertical-align:top;padding:2px;position:relative;font-size:13px;text-align:left}
.cal td.empty{background:var(--card2)}
.cal td .n{font-variant-numeric:tabular-nums;font-size:13px;line-height:1.2}
.cal td .lb{display:block;font-size:11px;line-height:1.2;margin-top:2px;color:var(--accent);word-break:break-all}
.cal td.tap{cursor:pointer}
.cal td.tap:active{background:var(--hl)}
.cal td.today{outline:2px solid var(--red);outline-offset:-2px}
.cal td.today::after{content:attr(data-today);position:absolute;right:2px;bottom:1px;font-size:10px;color:var(--red)}
.cal td.mark .n{display:inline-block;min-width:24px;text-align:center;border:2px solid var(--ink);border-radius:50%;line-height:20px;height:24px}
.cal td.sel{background:var(--hl)}
.cal td.good{background:var(--okbg)}
.cal td.wrong{background:var(--badbg)}
.detail{margin:8px auto;max-width:440px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px;min-height:60px;font-size:17px;text-align:center}
.detail .small{display:block}

/* 年曆 */
.ycal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px auto;max-width:460px}
.ycal .mm{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:3px 4px}
.ycal .mm.cur{border:2px solid var(--red)}
.ycal .mm .mt{font-size:12px;text-align:center;color:var(--ink);margin-bottom:1px}
.ycal .mm.cur .mt{color:var(--red);font-weight:600}
.ycal table{width:100%;border-collapse:collapse;table-layout:fixed}
.ycal td{font-size:8px;text-align:center;line-height:1.35;color:var(--sub);padding:0}
.ycal td.t{color:#fff;background:var(--red);border-radius:50%}
.ytitle{text-align:center;font-size:19px;margin:2px 0}

/* 行程配對 */
.match{margin:8px 0}
.slot{display:flex;align-items:center;gap:8px;margin:6px 0}
.slot .tm{flex:0 0 78px;text-align:center;border:1px solid var(--line);background:var(--card2);border-radius:8px;padding:6px 2px;font-size:19px;font-variant-numeric:tabular-nums;min-height:48px;display:flex;align-items:center;justify-content:center}
.slot .tm svg{width:54px;height:54px}
.slot .box{flex:1;min-height:52px;border:1px dashed var(--line);border-radius:8px;background:var(--card);padding:4px 6px;font-size:17px;display:flex;align-items:center;cursor:pointer}
.slot .box.filled{border-style:solid}
.slot .box.ok{background:var(--okbg);border-color:var(--ok)}
.slot .box.bad{background:var(--badbg);border-color:var(--bad)}
.cards{display:grid;grid-template-columns:1fr;gap:6px;margin-top:10px}
.cardb{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:17px;text-align:left;min-height:48px}
.cardb.sel{background:var(--hl);border-color:var(--ink)}
.cardb.used{opacity:.35}
.cardb .tr{font-size:12px}

/* 結果 */
.result{text-align:center}
.result .score{font-size:54px;font-weight:600;margin:6px 0;font-variant-numeric:tabular-nums}
.result .msg{margin:4px 0 12px}
.board{width:100%;border-collapse:collapse;margin:8px 0}
.board td,.board th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.board td.r,.board th.r{text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--sub);margin:6px 0}
.overlay{position:fixed;inset:0;background:rgba(43,42,39,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:20px 12px}
.overlay .panel{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;width:100%;max-width:460px}
@media (min-width:700px){#app{padding-top:24px}}

/* 解答條：固定在螢幕底部，上面的畫面不動 */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(43,42,39,.12);padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px))}
.sheet[hidden]{display:none}
.sheetin{max-width:560px;margin:0 auto;display:flex;flex-direction:column;max-height:48vh}
.sheet #fb{overflow:auto;flex:1 1 auto;min-height:0}
.sheet .fb{margin:0 0 6px;padding:8px 12px}
.sheet .fb .ans{font-size:20px;margin:2px 0}
.sheet .foot{margin-top:2px;flex:0 0 auto}
body.has-sheet #app{padding-bottom:calc(var(--sheet-h,260px) + 24px)}
.sheet .fb .big{font-size:16px}
.sheet .fb .why{font-size:13px;margin-top:2px;line-height:1.35}
.sheet .fb .small{font-size:12px;margin-top:3px!important}
.sheet .fb .ans{font-size:19px;margin:0}
.sheet .fb .ph{font-size:10px}
.sheet .btn{padding-top:8px;padding-bottom:8px}

/* 緊湊版面：讓題目和選項盡量同時看得到、不用捲動 */
#app{padding-top:8px}
.bar{margin-bottom:4px}.bar .btn{min-height:34px;padding:4px 12px}
.prog{margin-bottom:5px}
.instr{font-size:13px;line-height:1.3}
.qline{font-size:24px;margin:2px 0 0}
.vis{margin:4px 0}
.opts{gap:8px;margin:8px 0}
.opt{min-height:50px;padding:6px 8px;font-size:20px;gap:0}
.opts.one .opt{min-height:46px}
svg.clock{margin:2px auto;width:min(74vw,250px,31vh)}
@media (min-width:700px){#app{padding-top:12px}}
.cal{margin:2px auto}
.cal .ct{margin-bottom:2px;font-size:15px}
.cal th{padding:2px 0}
.cal td{height:38px;padding:1px 2px}
.vis .datebox{padding:4px 12px;font-size:17px;margin-bottom:2px}

/* 齒輪與設定 */
#app{position:relative}
button.gear{font-size:20px;line-height:1}
.title + .gear, #gear{position:absolute;right:14px;top:10px;width:42px;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:22px}
.btn.gear{width:38px;min-height:34px;padding:2px 0;position:static}
.bar .rgt{display:flex;align-items:center;gap:8px}
.lvchip{display:block;margin:6px auto 2px;padding:6px 14px;border:1px solid var(--line);border-radius:16px;background:var(--card);font-size:14px;color:var(--sub)}
.seg button .tr{display:block;font-size:11px;opacity:.85;margin-top:1px}
.overlay .panel h3{margin:0 0 6px;font-size:18px}
.lvchip{white-space:nowrap}.lvchip .tr.inline{margin-left:4px}
.seg button.on .tr{color:#e6e0d0;opacity:1}

</style>
</head>

<div id="app"></div>
<script>
/* ===== 一鍵靜音（只關音樂和音效，不影響念字的語音）— 每天一分鐘遊戲統一做法 ===== */
(function(){
  var KEY='hg.mute.time', MOUNT='', muted=false, masters=[];
  try{ muted = localStorage.getItem(KEY)==='1'; }catch(e){}
  /* 讓這個遊戲建立的所有 Web Audio 聲音，都先經過一個總音量；靜音＝總音量 0 */
  try{
    var BP = window.BaseAudioContext ? window.BaseAudioContext.prototype : (window.AudioContext||window.webkitAudioContext).prototype;
    var desc = Object.getOwnPropertyDescriptor(BP,'destination');
    if(desc && desc.get){
      Object.defineProperty(BP,'destination',{configurable:true,get:function(){
        var real = desc.get.call(this);
        if(!this.__hgMaster){
          try{ var g=this.createGain(); g.gain.value = muted?0:1; g.connect(real); this.__hgMaster=g; masters.push(g); }
          catch(e){ return real; }
        }
        return this.__hgMaster;
      }});
    }
  }catch(e){}
  /* 備用的 <audio> 播放（例如 iPhone 的 Chrome）也一起靜音 */
  try{
    var op = HTMLMediaElement.prototype.play;
    HTMLMediaElement.prototype.play = function(){ this.muted = muted; return op.apply(this, arguments); };
  }catch(e){}
  function apply(){ masters.forEach(function(g){ try{ g.gain.setValueAtTime(muted?0:1, g.context.currentTime); }catch(e){ g.gain.value = muted?0:1; } }); }
  function build(){
    if(document.getElementById('hgMute')) return;
    var st=document.createElement('style');
    st.textContent='#hgMute{position:fixed;left:8px;bottom:22px;z-index:2147483000;width:40px;height:40px;border-radius:50%;border:1px solid rgba(0,0,0,.28);background:rgba(255,255,255,.88);color:#222;font-size:19px;line-height:1;padding:0;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25);touch-action:manipulation;-webkit-tap-highlight-color:transparent}#hgMute:active{transform:scale(.94)}#hgMute.st{position:static;flex:0 0 40px;margin:0 0 0 8px}';
    document.head.appendChild(st);
    var b=document.createElement('button'); b.type='button'; b.id='hgMute';
    function paint(){ b.textContent = muted?'🔇':'🔊'; b.setAttribute('aria-pressed', muted?'true':'false');
      b.title = b.ariaLabel = muted ? '開啟音樂和音效 · Activar música y efectos' : '靜音（音樂和音效）· Silenciar música y efectos'; apply(); }
    b.addEventListener('click',function(e){ e.stopPropagation(); muted=!muted; try{ localStorage.setItem(KEY, muted?'1':'0'); }catch(err){} paint(); });
    b.addEventListener('pointerdown',function(e){ e.stopPropagation(); });
    paint();
    var anchor = MOUNT && document.querySelector(MOUNT);
    if(anchor && anchor.parentNode){ b.className='st'; anchor.parentNode.insertBefore(b, anchor.nextSibling); } else document.body.appendChild(b);
  }
  if(document.body) build(); else document.addEventListener('DOMContentLoaded', build);
})();
/* ===== /一鍵靜音 ===== */

</script>
<script>
'use strict';
/* =====================================================================
   練習時間 ¿Qué hora es?  —  核心：工具、共用設定、字典、拼音／注音、數字與日期的中文說法
   ===================================================================== */

/* ---------- 小工具 ---------- */
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const randInt = (a, b) => a + rnd(b - a + 1);
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = rnd(i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function sample(a, n){ return shuffle(a).slice(0, n); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const pad2 = n => (n < 10 ? '0' : '') + n;

/* ============ 共用設定（和其他遊戲同一份 hanziGames.settings，來自 game-kit/parts/settings.js） ============ */
const SETTINGS_KEY = 'hanziGames.settings';
const SET_OPTS = { script:['trad','simp'], lang:['es','en','zh'], phon:['pinyin','zhuyin','both','off'], rate:['slow','normal','fast'] };
const RATE_VALUE = { slow:0.45, normal:0.65, fast:0.85 };
function writeSettings(o){
  try{
    let cur = {};
    try{ cur = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}') || {}; }catch(e){}
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(Object.assign(cur, { v:1, script:o.script, lang:o.lang, phon:o.phon, rate:o.rate })));
  }catch(e){}
}
function readSettings(){
  const out = { v:1, script:'trad', lang:'es', phon:'pinyin', rate:'normal' };
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null'); }catch(e){}
  if (saved && typeof saved === 'object'){
    Object.keys(SET_OPTS).forEach(k => { if (SET_OPTS[k].includes(saved[k])) out[k] = saved[k]; });
  } else writeSettings(out);
  return out;
}
const Settings = readSettings();

/* ---------- 字典：字 拼音（台灣讀音）簡體 ---------- */
const DICT_SRC = `

const DICT = {};

/* ---------- 拼音 → 注音 ---------- */
const TONE_MAP = { 'ā':['a',1],'á':['a',2],'ǎ':['a',3],'à':['a',4],'ē':['e',1],'é':['e',2],'ě':['e',3],'è':['e',4],'ī':['i',1],'í':['i',2],'ǐ':['i',3],'ì':['i',4],
  'ō':['o',1],'ó':['o',2],'ǒ':['o',3],'ò':['o',4],'ū':['u',1],'ú':['u',2],'ǔ':['u',3],'ù':['u',4],'ǖ':['ü',1],'ǘ':['ü',2],'ǚ':['ü',3],'ǜ':['ü',4] };
function splitTone(s){ let tone = 0, base = ''; for (const ch of s){ const m = TONE_MAP[ch]; if (m){ base += m[0]; tone = m[1]; } else base += ch; } return { base:base.replace(/v/g, 'ü'), tone }; }
const ZY_INI = { zh:'ㄓ', ch:'ㄔ', sh:'ㄕ', b:'ㄅ', p:'ㄆ', m:'ㄇ', f:'ㄈ', d:'ㄉ', t:'ㄊ', n:'ㄋ', l:'ㄌ', g:'ㄍ', k:'ㄎ', h:'ㄏ', j:'ㄐ', q:'ㄑ', x:'ㄒ', r:'ㄖ', z:'ㄗ', c:'ㄘ', s:'ㄙ' };
const ZY_FIN = { a:'ㄚ', o:'ㄛ', e:'ㄜ', ai:'ㄞ', ei:'ㄟ', ao:'ㄠ', ou:'ㄡ', an:'ㄢ', en:'ㄣ', ang:'ㄤ', eng:'ㄥ', er:'ㄦ', i:'ㄧ', ia:'ㄧㄚ', ie:'ㄧㄝ', iao:'ㄧㄠ', iou:'ㄧㄡ', ian:'ㄧㄢ', in:'ㄧㄣ', iang:'ㄧㄤ', ing:'ㄧㄥ',
  iong:'ㄩㄥ', u:'ㄨ', ua:'ㄨㄚ', uo:'ㄨㄛ', uai:'ㄨㄞ', uei:'ㄨㄟ', uan:'ㄨㄢ', uen:'ㄨㄣ', uang:'ㄨㄤ', ong:'ㄨㄥ', ueng:'ㄨㄥ', 'ü':'ㄩ', 'üe':'ㄩㄝ', 'üan':'ㄩㄢ', 'ün':'ㄩㄣ' };
function py2zy(syl){
  const { base, tone } = splitTone(String(syl).toLowerCase());
  let ini = '', fin = base;
  if (/^(zh|ch|sh)/.test(base)){ ini = base.slice(0, 2); fin = base.slice(2); }
  else if (/^[bpmfdtnlgkhjqxrzcs]/.test(base)){ ini = base[0]; fin = base.slice(1); }
  else if (base[0] === 'y'){ const r = base.slice(1); fin = r === 'i' ? 'i' : r[0] === 'u' ? 'ü' + r.slice(1) : r[0] === 'i' ? r : 'i' + r; }
  else if (base[0] === 'w'){ const r = base.slice(1); fin = r === 'u' ? 'u' : 'u' + r; }
  if (ini && 'jqx'.includes(ini) && fin[0] === 'u') fin = 'ü' + fin.slice(1);
  if (ini){ if (fin === 'iu') fin = 'iou'; else if (fin === 'ui') fin = 'uei'; else if (fin === 'un') fin = 'uen'; }
  let z = ZY_INI[ini] || '';
  if (ini && 'zh ch sh r z c s'.split(' ').includes(ini) && fin === 'i') z += '';
  else { const f = ZY_FIN[fin]; if (f === undefined) return syl; z += f; }
  const mark = ['', '', 'ˊ', 'ˇ', 'ˋ'][tone];
  return (tone === 0 ? '˙' : '') + z + mark;
}

/* ---------- 把一句中文拆成「字＋拼音」 ----------
   寫法：字後面可以接 {拼音} 來指定這個字的讀音，例如  哪一{yì}天 */
function parseLine(text){
  const arr = Array.from(String(text)), out = [];
  for (let i = 0; i < arr.length; i++){
    const c = arr[i];
    if (c === '{') continue;
    const e = DICT[c];
    const item = { c, py: e ? e.py : null, hz: !!e };
    if (arr[i + 1] === '{'){ const j = arr.indexOf('}', i + 2); if (j > 0){ item.py = arr.slice(i + 2, j).join(''); item.hz = true; i = j; } }
    out.push(item);
  }
  return out;
}
function plainZh(text){ return String(text).replace(/\{[^}]*\}/g, ''); }
function lineHTML(text){
  const simp = Settings.script === 'simp', ph = Settings.phon;
  let o = '';
  parseLine(text).forEach(it => {
    const ch = simp ? (DICT[it.c] ? DICT[it.c].s : (S2[it.c] || it.c)) : it.c;
    if (!it.hz || ph === 'off'){ o += `<span class="ch${it.hz ? '' : ' np'}"><span class="h">${esc(ch)}</span></span>`; return; }
    const py = it.py, zy = py2zy(py);
    let top = '', bot = '';
    if (ph === 'pinyin') top = py;
    else if (ph === 'zhuyin') bot = zy;
    else { top = py; bot = zy; }
    o += `<span class="ch">${ph === 'zhuyin' ? '' : `<span class="ph">${esc(top)}</span>`}<span class="h">${esc(ch)}</span>${bot ? `<span class="ph">${esc(bot)}</span>` : ''}</span>`;
  });
  return o;
}

/* ---------- 數字 ---------- */
const DIGZ = '零一二三四五六七八九';
function numZh(n){
  if (n < 10) return DIGZ[n];
  if (n < 20) return '十' + (n % 10 ? DIGZ[n % 10] : '');
  const t = Math.floor(n / 10), u = n % 10;
  return DIGZ[t] + '十' + (u ? DIGZ[u] : '');
}
const digitsZh = n => String(n).split('').map(c => DIGZ[+c]).join('');
const hourZh = h => (h === 2 ? '兩' : numZh(h));
const yearQtyZh = y => '二千零' + numZh(y % 100);     // 「二千零二十六」：把年份當成一般數字念（錯誤說法）

/* ---------- 時間的中文說法 ----------
   st = { half:true/false（30分用「半」）, zheng:true/false（整點加「整」）}；s 有值時一律把分、秒都說出來 */
function tZh(h, m, s, st){
  let t = hourZh(h) + '點';
  if (s != null){
    t += (m === 0 ? '零分' : m < 10 ? '零' + DIGZ[m] + '分' : numZh(m) + '分');
    t += numZh(s) + '秒';
    return t;
  }
  if (m === 0) return t + (st && st.zheng ? '整' : '');
  if (m === 30 && st && st.half) return t + '半';
  if (m < 10) return t + (st && st.ling === false ? '' : '零') + DIGZ[m] + '分';   // 八點零五分／八點五分都對，每題只用一種
  return t + numZh(m) + '分';
}
const digital = (h, m, s) => h + ':' + pad2(m) + (s != null ? ':' + pad2(s) : '');
const digital24 = (H, m) => pad2(H) + ':' + pad2(m);
/* 時段：早上 6–11、中午 12、下午 13–17、晚上 18–23（凌晨等不常用的不出現） */
function periodOf(H){ return H === 12 ? '中午' : H < 12 ? '早上' : H < 18 ? '下午' : '晚上'; }
const h12 = H => (H % 12 === 0 ? 12 : H % 12);
const ptZh = (H, m, st) => periodOf(H) + tZh(h12(H), m, null, st);

/* ---------- 選項 ---------- */
const okey = o => (o.key != null ? o.key : o.zh);
function mkOptions(correct, wrongs, n){
  n = n || 4;
  const seen = new Set([okey(correct)]), out = [];
  for (const w of wrongs){ const k = okey(w); if (seen.has(k)) continue; seen.add(k); out.push(Object.assign({ ok:false }, w)); if (out.length >= n - 1) break; }
  return shuffle([Object.assign({}, correct, { ok:true }), ...out]);
}
const timeKey = (h, m, s) => h + ':' + m + ':' + (s == null ? '' : s);

/* =====================  單元一：看時鐘  ===================== */
function pickTime(lv, withSec){
  const h = randInt(1, 12); let m, s = null;
  if (lv === 'easy') m = pick([0, 30]);
  else if (lv === 'mid') m = pick([0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55]);
  else m = Math.random() < 0.15 ? pick([0, 30]) : randInt(1, 59);
  if (withSec && lv === 'hard' && Math.random() < 0.6){ s = pick([10, 15, 20, 25, 30, 35, 40, 45, 50, 55]); if (m === 0) m = randInt(1, 59); }
  return { h, m, s };
}
const randStyle = () => ({ half:Math.random() < 0.5, zheng:Math.random() < 0.5, ling:Math.random() < 0.5 });

function wrongTimes(h, m, s, lv){
  const c = [];
  const add = (h2, m2, s2, why) => {
    h2 = ((h2 - 1 + 12) % 12) + 1;
    if (m2 < 0 || m2 > 59 || (s2 != null && (s2 < 0 || s2 > 59))) return;
    if (timeKey(h2, m2, s2) === timeKey(h, m, s)) return;
    c.push({ h:h2, m:m2, s:s2, why:why || 'time' });
  };
  if (lv === 'easy'){
    add(h + 1, m, s); add(h - 1, m, s); add(h + 2, m, s); add(h, m === 0 ? 30 : 0, s); add(h + 1, m === 0 ? 30 : 0, s); add(h - 1, m === 0 ? 30 : 0, s);
    return c;
  }
  add(h + 1, m, s); add(h - 1, m, s); add(h + 2, m, s);
  if (m % 5 === 0){ add(h, (m + 5) % 60, s); add(h, (m + 55) % 60, s); add(h, (m + 10) % 60, s); }
  else { add(h, m + 1, s); add(h, m - 1, s); add(h, m + 2, s); add(h, m - 2, s); }
  if (m % 5 === 0 && s == null){ const h2 = (m / 5) || 12, m2 = (h % 12) * 5; add(h2, m2, s, 'swap'); }
  if (s != null){ add(h, m, (s + 5) % 60); add(h, m, (s + 55) % 60); if (m >= 10) add(h, s, m, 'swapms'); }
  return c;
}
function formErrors(h, m, s, st){
  const out = [], t = tZh(h, m, s, st);
  if (s == null){
    if (m === 0 || (m === 30 && st.half)) out.push({ zh:hourZh(h) + '小時' + (m === 30 ? '半' : (st.zheng ? '整' : '')), why:'hourDur' });
    else out.push({ zh:hourZh(h) + '小時' + (m < 10 ? (st.ling === false ? '' : '零') + DIGZ[m] : numZh(m)) + '分', why:'hourDur' });
    if (m !== 0 && !(m === 30 && st.half)) out.push({ zh:hourZh(h) + '點' + (m < 10 ? (st.ling === false ? '' : '零') + DIGZ[m] : numZh(m)) + '分鐘', why:'minDur' });
  } else {
    out.push({ zh:t.slice(0, -1) + '分', why:'secUnit' });
  }
  if (h === 2) out.push({ zh:t.replace('兩', '二'), why:'two' });
  return out.filter(f => f.zh !== t);
}

function gClockChoice(lv){
  const { h, m, s } = pickTime(lv, true), st = randStyle();
  const correctZh = tZh(h, m, s, st);
  const nForms = lv === 'easy' ? 1 : (Math.random() < 0.5 ? 1 : 2);
  const wrongs = shuffle(formErrors(h, m, s, st)).slice(0, nForms);

const HOUR_CONF = { 1:[7], 7:[1], 4:[10], 10:[4], 2:[12], 12:[2], 3:[8], 8:[3] };
function confuseMin(m){
  const c = [];
  if (m >= 10){ const sw = (m % 10) * 10 + Math.floor(m / 10); if (sw < 60 && sw !== m) c.push(sw); }
  if (m + 10 < 60) c.push(m + 10); if (m - 10 >= 0) c.push(m - 10);
  if (m + 5 < 60) c.push(m + 5); if (m - 5 >= 0) c.push(m - 5);
  if (m + 1 < 60) c.push(m + 1); if (m - 1 >= 0) c.push(m - 1);
  return c;
}
function confTimes(h, m, s, lv){
  const set = new Map();
  const add = (h2, m2, s2) => {
    h2 = ((h2 - 1 + 12) % 12) + 1;
    if (m2 < 0 || m2 > 59 || (s2 != null && (s2 < 0 || s2 > 59))) return;
    const k = timeKey(h2, m2, s2);
    if (k === timeKey(h, m, s) || set.has(k)) return;
    set.set(k, { h:h2, m:m2, s:s2 });
  };
  const hc = HOUR_CONF[h] || [];
  const mcs = lv === 'easy' ? [m === 0 ? 30 : 0] : shuffle(confuseMin(m));
  hc.forEach(x => add(x, m, s));
  mcs.forEach(x => add(h, x, s));
  if (hc.length && mcs.length) add(hc[0], mcs[0], s);
  if (s != null) shuffle(confuseMin(s)).forEach(x => add(h, m, x));
  add(h + 1, m, s); add(h - 1, m, s);
  return shuffle([...set.values()]);
}
function gClockListen(lv){

  let options;
  if (variant === 'text'){

  } else {
    options = mkOptions({ key:'c' + timeKey(h, m, s), svg:clockSVG({ h, m, s, mini:true }), why:null, d:digital(h, m, s) },
      cands.map(c => ({ key:'c' + timeKey(c.h, c.m, c.s), svg:clockSVG({ h:c.h, m:c.m, s:c.s, mini:true }), why:'heard', d:digital(c.h, c.m, c.s) })));
  }
  return { id:'clockListen', kind:'choice',
    instr:variant === 'text' ? L('請聽，選出正確的時間。', 'Escucha y elige la hora correcta.', 'Listen and choose the correct time.')
                             : L('請聽，選出正確的時鐘。', 'Escucha y elige el reloj correcto.', 'Listen and choose the correct clock.'),
    line:null, visual:null, audio:zh, peek:zh, optClass:variant === 'clock' ? 'clk' : '',
    options, fb:{ ansZh:zh, extra:digital(h, m, s) } };
}

function randDate(){ const y = randInt(2024, 2029), m = randInt(1, 12), d = randInt(1, dim(y, m)); return { y, m, d }; }
/* o: {st:'日'|'號', sun, year, week, weekText, order:'ymd'|'dmy'|'mdy', gem, ged, gey, qy} */
function dateStr(y, m, d, o){
  const Y = o.year ? (o.qy ? yearQtyZh(y) : digitsZh(y)) + (o.gey ? '個年' : '年') : '';
  const M = numZh(m) + (o.gem ? '個月' : '月');
  const D = numZh(d) + (o.ged ? '個' + o.st : o.st);
  const core = o.order === 'dmy' ? D + M + Y : o.order === 'mdy' ? M + D + Y : Y + M + D;
  const W = o.week ? (o.weekText || wkZh(weekdayOf(y, m, d), o.sun)) : '';
  return core + W;
}
function gDateChoice(lv){
  const { y, m, d } = randDate(), st = pick(['日', '號']), sun = pick(['天', '日']);
  const withYear = lv !== 'easy', withWeek = lv === 'hard';
  const base = { st, sun, year:withYear, week:withWeek, order:'ymd' };
  const mk = (yy, mm, dd, o) => dateStr(yy, mm, dd, Object.assign({}, base, o || {}));
  const correct = mk(y, m, d);
  const grp = { order:[], ge:[], qty:[], val:[], wk:[] };
  grp.order.push({ zh:mk(y, m, d, { order:'dmy' }), why:'order' });
  if (withYear) grp.order.push({ zh:mk(y, m, d, { order:'mdy' }), why:'order' });
  [{ gem:true }, { ged:true }].concat(withYear ? [{ gey:true }] : []).forEach(g => grp.ge.push({ zh:mk(y, m, d, g), why:'ge' }));
  if (withYear) grp.qty.push({ zh:mk(y, m, d, { qy:true }), why:'yearQty' });
  [d - 1, d + 1, d - 2, d + 2].filter(x => x >= 1 && x <= dim(y, m)).forEach(x => grp.val.push({ zh:mk(y, m, x), why:'val' }));
  [m - 1, m + 1].filter(x => x >= 1 && x <= 12).forEach(x => grp.val.push({ zh:mk(y, x, Math.min(d, dim(y, x))), why:'val' }));
  if (withYear) [y - 1, y + 1].forEach(x => grp.val.push({ zh:mk(x, m, d), why:'val' }));
  if (d <= 12 && d !== m) grp.val.push({ zh:mk(y, d, m), why:'val' });
  if (withWeek) shuffle([0, 1, 2, 3, 4, 5, 6].filter(x => x !== weekdayOf(y, m, d))).slice(0, 2).forEach(x => grp.wk.push({ zh:mk(y, m, d, { weekText:wkZh(x, sun) }), why:'weekWrong' }));
  const chosen = [pick(grp.order), pick(grp.ge)];
  const third = lv === 'easy' ? ['val'] : lv === 'mid' ? ['qty', 'val'] : ['qty', 'val', 'wk', 'wk'];
  const tg = pick(third); chosen.push(pick(grp[tg].length ? grp[tg] : grp.val));
  const extra = shuffle([].concat(grp.val, grp.ge, grp.order, grp.qty, grp.wk));
  return { id:'dateChoice', kind:'choice',
    instr:L('看月曆上圈起來的日子，選出正確的中文說法。', 'Mira el día marcado en el calendario y elige cómo se dice en chino.', 'Look at the circled day and choose the correct Chinese.'),
    line:{ zh:'這一{yì}天是什麼時候{hou}？', es:'¿Qué fecha es este día?', en:'What date is this day?' },
    visual:{ type:'cal', y, m, mark:d, mode:'none', cap:true },
    options:mkOptions({ zh:correct, why:null }, chosen.concat(extra)),
    fb:{ ansZh:correct, extra:fmtDate(y, m, d, true) + '（' + dayName(weekdayOf(y, m, d)) + '）' } };
}

const MON_CONF = { 12:[2, 11], 2:[12], 10:[4, 11], 4:[10], 7:[1, 11], 1:[7, 11], 11:[1, 10, 12], 3:[8], 8:[3], 5:[9], 9:[5], 6:[], };
function gDateListen(lv){
  const { y, m, d } = randDate(), st = pick(['日', '號']), sun = pick(['天', '日']);
  const withYear = lv !== 'easy', withWeek = lv === 'hard';

  const mk = (yy, mm, dd) => dateStr(yy, mm, dd, base);
  const zh = mk(y, m, d);
  const N = dim(y, m), cand = new Map();
  const add = (yy, mm, dd) => { if (mm < 1 || mm > 12 || dd < 1 || dd > dim(yy, mm)) return; const k = yy + '/' + mm + '/' + dd; if (k === y + '/' + m + '/' + d || cand.has(k)) return; cand.set(k, { y:yy, m:mm, d:dd }); };
  (MON_CONF[m] || []).forEach(x => add(y, x, Math.min(d, dim(y, x))));

  [m + 1, m - 1].forEach(x => add(y, x, Math.min(d, N)));
  if (withYear) [1, -1].forEach(x => add(y + x, m, d));
  const cs = shuffle([...cand.values()]);

}

const DAILY = [

  { short:'吃早餐', es:'desayunar',         en:'have breakfast',  hours:[7, 8, 9] },
  { short:'上班',   es:'ir al trabajo',     en:'go to work',      hours:[8, 9] },
  { short:'上課',   es:'tener clase',       en:'have class',      hours:[9, 10, 14, 15] },
  { short:'吃午飯', es:'almorzar',          en:'have lunch',      hours:[12, 13] },
  { short:'喝咖啡', es:'tomar café',        en:'drink coffee',    hours:[10, 14, 15] },
  { short:'做功課', es:'hacer la tarea',    en:'do homework',     hours:[14, 15, 16, 20] },
  { short:'回家',   es:'volver a casa',     en:'go home',         hours:[16, 19] },
  { short:'運動',   es:'hacer ejercicio',   en:'exercise',        hours:[7, 19, 20] },

  { short:'去學校', es:'ir a la escuela',   en:'go to school',    hours:[7, 8] }

const schedMins = lv => (lv === 'easy' ? [0] : lv === 'mid' ? [0, 30] : [0, 10, 20, 30, 40, 50]);
function pickSchedule(n, lv, withPeriod){
  const res = [], key = r => (withPeriod ? r.H * 100 + r.m : h12(r.H) * 100 + r.m);
  for (const a of shuffle(DAILY)){
    if (res.length >= n) break;
    const r = { a, H:pick(a.hours), m:pick(schedMins(lv)) };
    if (res.some(x => key(x) === key(r))) continue;
    res.push(r);
  }
  return res.sort((p, q) => p.H * 60 + p.m - (q.H * 60 + q.m));
}
const schedZh = (a, H, m, withPeriod) => '我' + (withPeriod ? periodOf(H) : '') + tZh(h12(H), m, null, { half:true, zheng:false }) + a.short;
const schedLabel = (H, m, withPeriod) => (withPeriod ? digital24(H, m) : digital(h12(H), m));

function gSchedMatch(lv){
  const withPeriod = lv !== 'easy', n = lv === 'easy' ? 3 : lv === 'mid' ? 4 : 5;
  const items = pickSchedule(n, lv, withPeriod);
  const slots = items.map(it => ({ label:schedLabel(it.H, it.m, withPeriod) }));
  const cards = shuffle(items.map((it, i) => ({ zh:schedZh(it.a, it.H, it.m, withPeriod), slot:i, gloss:L('', it.a.es, it.a.en) })));
  return { id:'schedMatch', kind:'match',
    instr:L('把每一句話放到正確的時間。先點句子，再點時間。', 'Pon cada frase en su hora. Toca la frase y luego la hora.', 'Put each sentence at the right time. Tap a sentence, then a time.'),
    line:null, visual:null, slots, cards, dbg:{ items:items.map(it => ({ short:it.a.short, H:it.H, m:it.m })), withPeriod },
    fb:{ ansZh:items.map(it => schedZh(it.a, it.H, it.m, withPeriod)).join('　'), extra:null } };
}
function gSchedListen(lv){
  const withPeriod = lv !== 'easy';
  const it = pickSchedule(1, lv, withPeriod)[0], { a, H, m } = it;
  const zh = schedZh(a, H, m, withPeriod), lab = schedLabel(H, m, withPeriod);
  const card = (act, HH, mm, why) => ({ key:act.short + '|' + schedLabel(HH, mm, withPeriod), zh:act.short, badge:schedLabel(HH, mm, withPeriod), gloss:L('', act.es, act.en), why, d:act.short + ' ' + schedLabel(HH, mm, withPeriod) });
  const wrongs = [];
  const flip = m === 0 ? 30 : 0;
  [[H + 1, m], [H - 1, m], [H, flip], [H + 2, m]].forEach(([HH, mm]) => { if (HH >= 6 && HH <= 23 && (withPeriod || h12(HH) !== h12(H) || mm !== m)) wrongs.push(card(a, HH, mm, 'heard')); });
  const others = shuffle(DAILY.filter(x => x.short !== a.short));
  others.slice(0, 2).forEach(o => wrongs.push(card(o, H, m, 'act')));
  others.slice(2, 4).forEach(o => wrongs.push(card(o, pick(o.hours), pick(schedMins(lv)), 'act')));
  const picked = shuffle(wrongs);

  const sameAct = picked.filter(w => w.zh === a.short), otherAct = picked.filter(w => w.zh !== a.short);

    instr:L('請聽，選出正確的行程和時間。', 'Escucha y elige la actividad y la hora correctas.', 'Listen and choose the right activity and time.'),
    line:null, visual:null, audio:zh, peek:zh, optClass:'cardopt', dbg:{ short:a.short, H, m, withPeriod },
    options:mkOptions(card(a, H, m, null), wr),
    fb:{ ansZh:zh, extra:lab } };
}

const PERIOD_HOURS = [6, 7, 8, 9, 10, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23];
function gPeriodRead(lv){
  /* 反過來：看中文（早上／中午／下午／晚上＋時間），選出正確的數字時間 */
  const H = pick(PERIOD_HOURS), m = pick(schedMins(lv)), st = { half:true, zheng:Math.random() < 0.5 };
  const zh = ptZh(H, m, st), flip = m === 0 ? 30 : 0, wrongs = [];
  const add = (HH, mm, why) => { if (HH >= (why === 'pmAm' ? 1 : 6) && HH <= 23 && !(HH === H && mm === m)) wrongs.push({ zh:digital24(HH, mm), why }); };
  if (H <= 12) add(H + 12, m, 'pmAm'); else add(H - 12, m, 'pmAm');           // 早上／下午搞混（例如 03:00 和 15:00）
  add(H + 1, m, 'time'); add(H - 1, m, 'time'); add(H, flip, 'time'); add(H + 2, m, 'time');
  const trap = wrongs.filter(w => w.why === 'pmAm'), rest = shuffle(wrongs.filter(w => w.why !== 'pmAm'));
  return { id:'periodChoice', kind:'choice',
    instr:L('看中文時間，選出正確的數字時間。', 'Lee la hora en chino y elige la hora en números.', 'Read the Chinese time and choose the digital time.'),
    line:{ zh, es:'', en:'' }, visual:null, dbg:{ form:'read', H, m },
    options:mkOptions({ zh:digital24(H, m), why:null, d:digital24(H, m) }, [].concat(trap, rest)),
    fb:{ ansZh:zh, extra:digital24(H, m) } };
}
function gPeriodChoice(lv){
  if (Math.random() < 0.5) return gPeriodRead(lv);
  const H = pick(PERIOD_HOURS), m = pick(schedMins(lv)), st = { half:true, zheng:Math.random() < 0.5 };
  const correct = ptZh(H, m, st), hh = h12(H);
  const wrongs = [];
  wrongs.push({ zh:tZh(hh, m, null, st) + periodOf(H), why:'periodOrder' });
  ['早上', '下午', '晚上', '中午'].filter(p => p !== periodOf(H) && (p !== '中午' || H === 12 ? true : false)).forEach(p => wrongs.push({ zh:p + tZh(hh, m, null, st), why:'periodWrong' }));
  [H + 1, H - 1].filter(x => x >= 6 && x <= 23).forEach(x => wrongs.push({ zh:ptZh(x, m, st), why:'time', d:digital24(x, m) }));
  const order = wrongs.filter(w => w.why === 'periodOrder'), pw = shuffle(wrongs.filter(w => w.why === 'periodWrong')), tm = shuffle(wrongs.filter(w => w.why === 'time'));
  const wr = [].concat(order, pw.slice(0, 1), tm.slice(0, 1), pw.slice(1), tm.slice(1));
  return { id:'periodChoice', kind:'choice',
    instr:L('看數字時間，選出正確的中文說法（含早上、中午、下午、晚上）。', 'Mira la hora en números y elige cómo se dice (con mañana, mediodía, tarde o noche).', 'Look at the digital time and choose how to say it (with morning, noon, afternoon or evening).'),
    line:null, visual:{ type:'digital', text:digital24(H, m) },
    options:mkOptions({ zh:correct, why:null, d:digital24(H, m) }, wr),
    fb:{ ansZh:correct, extra:digital24(H, m) } };
}

const nEvents = lv => (lv === 'easy' ? 5 : lv === 'mid' ? 8 : 11);
function makeMonth(n){
  const y = randInt(2025, 2028), m = randInt(1, 12), N = dim(y, m);
  const free = new Set(Array.from({ length:N }, (_, i) => i + 1)), out = [];
  shuffle(EVENTS).slice(0, n).forEach(ev => {
    let pool = [...free].filter(d => { const w = weekdayOf(y, m, d); return ev.day === 'any' || (ev.day === 'wk' ? (w >= 1 && w <= 5) : (w === 0 || w === 6)); });
    if (!pool.length) pool = [...free];
    const day = pick(pool); free.delete(day);
    const t = pick(ev.times);
    out.push({ day, ev, h:t[0], mi:t[1] });
  });
  return { y, m, events:out.sort((a, b) => a.day - b.day) };
}
function calVisual(mo, mode, extra){
  const labels = {}, details = {};
  mo.events.forEach(e => {
    labels[e.day] = e.ev.label;
    const dow = weekdayOf(mo.y, mo.m, e.day);
    details[e.day] = { head:monthZh(mo.m) + dayZh(e.day, '號') + '　' + wkZh(dow, '天'), body:ptZh(e.h, e.mi, { half:true, zheng:false }) + '　' + e.ev.doZh, gloss:L('', e.ev.es, e.ev.en) };
  });
  return Object.assign({ type:'cal', y:mo.y, m:mo.m, mode, labels, details }, extra || {});
}
function gCalFindDay(lv){
  /* 月曆上不寫任何行程；行程只寫在題目裡，學生讀完要在空白月曆上點出對的日期 */
  const mo = makeMonth(lv === 'easy' ? 2 : lv === 'hard' ? 3 : pick([2, 3])), e = pick(mo.events);
  const facts = mo.events.map(x => monthZh(mo.m) + dayZh(x.day, '號') + x.ev.fut).join('，');
  const v = calVisual(mo, 'pick'); v.labels = {}; v.details = {};
  return { id:'calFindDay', kind:'tap',
    instr:L('讀題目裡的行程，在月曆上點出正確的日子，再按「確定」。', 'Lee el plan en la pregunta, toca el día correcto en el calendario y pulsa «Confirmar».', 'Read the plans in the question, tap the right day on the calendar, then press “Confirm”.'),
    line:{ zh:facts + '。' + e.ev.label + '是哪一{yì}天？', es:'¿Qué día es: ' + e.ev.es + '?', en:'Which day: ' + e.ev.en + '?' },
    dbg:{ events:mo.events.map(x => ({ d:x.day, label:x.ev.label, fut:x.ev.fut })), asked:e.ev.label },
    visual:v, target:{ y:mo.y, m:mo.m, d:e.day },
    fb:{ ansZh:monthZh(mo.m) + dayZh(e.day, '號'), extra:fmtDate(mo.y, mo.m, e.day, true) } };
}
function gCalWhatDo(lv){
  const mo = makeMonth(nEvents(lv)), e = pick(mo.events), st = '號';
  const opt = x => ({ key:x.ev.id, zh:x.ev.doZh, gloss:L('', x.ev.es, x.ev.en), why:'ev', d:x.ev.doZh });
  return { id:'calWhatDo', kind:'choice',
    instr:L('看月曆，選出那一天要做什麼。', 'Mira el calendario y elige qué hay que hacer ese día.', 'Look at the calendar and choose what happens that day.'),

function gCalWhatTime(lv){
  const mo = makeMonth(nEvents(lv)), e = pick(mo.events), st = { half:true, zheng:false };
  const correct = ptZh(e.h, e.mi, st), flip = e.mi === 0 ? 30 : 0, wrongs = [];
  [[e.h + 1, e.mi], [e.h - 1, e.mi], [e.h, flip], [e.h + 2, e.mi], [e.h - 2, e.mi], [e.h + 1, flip]].forEach(([H, mm]) => {

    instr:L('點月曆上的日子看行程，再選出正確的時間。', 'Toca un día del calendario para ver el plan y elige la hora correcta.', 'Tap a day on the calendar to see the plan, then choose the right time.'),

/* =====================  單元五：星期和日期推算  ===================== */
const REL_DAYS = { '-2':'前天', '-1':'昨天', '0':'今天', '1':'明天', '2':'後天' };
const REL_DAYS_L = { '-2':['anteayer', 'the day before yesterday'], '-1':['ayer', 'yesterday'], '0':['hoy', 'today'], '1':['mañana', 'tomorrow'], '2':['pasado mañana', 'the day after tomorrow'] };
function randToday(){
  for (;;){
    const y = randInt(2025, 2028), m = randInt(1, 12), d = randInt(8, 22), w = weekdayOf(y, m, d);
    if (w >= 1 && w <= 5) return { y, m, d, w };
  }
}
const sameMonth = (a, t) => a.y === t.y && a.m === t.m;
function todayVisual(T, extra){ return Object.assign({ type:'cal', y:T.y, m:T.m, today:T.d, mode:'none' }, extra || {}); }
function dateOpt(t, why){ return { zh:monthZh(t.m) + dayZh(t.d, '號'), why:why || 'val', d:fmtDate(t.y, t.m, t.d, false) }; }

function gRelDay(lv){
  const T = randToday(), offs = lv === 'easy' ? [-1, 1] : [-2, -1, 1, 2], off = pick(offs);
  const askWeek = lv === 'easy' ? true : lv === 'mid' ? Math.random() < 0.5 : Math.random() < 0.3;
  const tg = addDays(T.y, T.m, T.d, off), word = REL_DAYS[String(off)];
  const lt = REL_DAYS_L[String(off)];
  const instr = L('看月曆上標示「今天」的那一格，選出正確的答案。', 'Mira el día marcado como «hoy» y elige la respuesta correcta.', 'Find the day marked “today” and choose the right answer.');
  const sun = pick(['天', '日']);
  let options, line, ansZh;
  if (askWeek){
    const dow = weekdayOf(tg.y, tg.m, tg.d); ansZh = wkZh(dow, sun);
    const wr = shuffle([-2, -1, 0, 1, 2].filter(x => x !== off)).map(x => { const t = addDays(T.y, T.m, T.d, x); return { zh:wkZh(weekdayOf(t.y, t.m, t.d), sun), why:'rel' }; });
    shuffle([0, 1, 2, 3, 4, 5, 6]).forEach(x => wr.push({ zh:wkZh(x, sun), why:'wk' }));
    options = mkOptions({ zh:ansZh, why:null }, wr);
    line = { zh:word + '是星期幾？', es:'¿Qué día de la semana es ' + lt[0] + '?', en:'What day of the week is ' + lt[1] + '?' };
  } else {
    ansZh = monthZh(tg.m) + dayZh(tg.d, '號');
    const wr = [];
    [-2, -1, 0, 1, 2].filter(x => x !== off).forEach(x => wr.push(dateOpt(addDays(T.y, T.m, T.d, x), 'rel')));
    [7, -7].forEach(x => wr.push(dateOpt(addDays(tg.y, tg.m, tg.d, x), 'weekShift')));
    options = mkOptions({ zh:ansZh, why:null, d:fmtDate(tg.y, tg.m, tg.d, false) }, shuffle(wr));
    line = { zh:word + '是幾月幾號？', es:'¿Qué fecha es ' + lt[0] + '?', en:'What is the date ' + lt[1] + '?' };
  }
  return { id:'relDay', kind:'choice', instr, line, visual:todayVisual(T), options,
    fb:{ ansZh, extra:'今天 ' + fmtDate(T.y, T.m, T.d, true) + '（' + dayName(T.w) + '）' } };
}

const REL_WEEK = { '-1':['上', 'la semana pasada', 'last week'], '0':['這', 'esta semana', 'this week'], '1':['下', 'la próxima semana', 'next week'] };
function gRelWeek(lv){
  for (let g = 0; g < 200; g++){
    const T = randToday(), wOff = pick(lv === 'easy' ? [0, 1] : [-1, 0, 1]), X = randInt(1, 5);
    if (wOff === 0 && X === T.w) continue;
    const mondayOff = -((T.w + 6) % 7);
    const tg = addDays(T.y, T.m, T.d, mondayOff + wOff * 7 + (X - 1));
    if (!sameMonth(T, tg)) continue;
    const word = REL_WEEK[String(wOff)][0] + wkZh(X, '天');
    const wr = [];
    const sh = (n, why) => { const t = addDays(tg.y, tg.m, tg.d, n); if (sameMonth(T, t)) wr.push(dateOpt(t, why)); };
    sh(7, 'weekShift'); sh(-7, 'weekShift'); sh(1, 'dayShift'); sh(-1, 'dayShift'); sh(2, 'dayShift'); sh(-2, 'dayShift');
    const order = shuffle(wr), wk = order.filter(x => x.why === 'weekShift'), ds = order.filter(x => x.why === 'dayShift');
    const wrongs = [].concat(wk.slice(0, 1), ds.slice(0, 1), order);
    const ansZh = monthZh(tg.m) + dayZh(tg.d, '號');
    return { id:'relWeek', kind:'choice',
      instr:L('看月曆上標示「今天」的那一格，選出正確的日期。', 'Mira el día marcado como «hoy» y elige la fecha correcta.', 'Find the day marked “today” and choose the right date.'),
      line:{ zh:word + '是幾月幾號？', es:'¿Qué fecha es el ' + DAYS_ES[X] + ' de ' + REL_WEEK[String(wOff)][1] + '?', en:'What is the date of ' + DAYS_EN[X] + ' ' + REL_WEEK[String(wOff)][2] + '?' },
      visual:todayVisual(T), options:mkOptions({ zh:ansZh, why:null, d:fmtDate(tg.y, tg.m, tg.d, false) }, wrongs),
      fb:{ ansZh, extra:'今天 ' + fmtDate(T.y, T.m, T.d, true) + '（' + dayName(T.w) + '）' } };
  }
  return gRelDay(lv);
}

function gYearView(lv){
  const cross = lv === 'hard' && Math.random() < 0.5;
  const y = randInt(2025, 2028), m = cross ? pick([1, 12]) : randInt(2, 11), d = randInt(1, 28);
  const kinds = lv === 'easy' ? ['pm', 'nm'] : lv === 'mid' ? ['pm', 'nm', 'ly', 'ny'] : ['pm', 'nm', 'ly', 'ny', 'l2', 'n2'];
  let kind = pick(kinds);
  if (cross){ kind = m === 1 ? pick(['pm', 'ly']) : pick(['nm', 'ny']); }
  const vis = { type:'ycal', y, m, d };
  const base = { id:'yearView', kind:'choice',
    instr:L('看年曆（紅框是這個月），選出正確的答案。', 'Mira el calendario anual (el marco rojo es este mes) y elige la respuesta.', 'Look at the year calendar (the red frame is this month) and choose the answer.'),
    visual:vis };
  if (kind === 'pm' || kind === 'nm'){
    const t = kind === 'pm' ? m - 1 : m + 1, tm = ((t - 1 + 12) % 12) + 1;
    const wr = shuffle([tm - 1, tm + 1, tm + 2, tm - 2, m].map(x => ((x - 1 + 12) % 12) + 1).filter(x => x !== tm)).map(x => ({ zh:monthZh(x), why:x === m ? 'rel' : 'month' }));
    const ansZh = monthZh(tm);
    return Object.assign(base, {
      line:{ zh:(kind === 'pm' ? '上' : '下') + '個月是幾月？', es:kind === 'pm' ? '¿Qué mes es el mes pasado?' : '¿Qué mes es el próximo mes?', en:kind === 'pm' ? 'What month is last month?' : 'What month is next month?' },
      options:mkOptions({ zh:ansZh, why:null }, wr), fb:{ ansZh, extra:fmtDate(y, m, d, true) + (cross ? (kind === 'pm' ? '（上個月是去年）' : '（下個月是明年）') : '') } });
  }
  const dy = { ly:-1, ny:1, l2:-2, n2:2 }[kind], ty = y + dy, ansZh = yearZh(ty);
  const word = { ly:'去年', ny:'明年', l2:'前年', n2:'後年' }[kind];
  const tr = { ly:['el año pasado', 'last year'], ny:['el próximo año', 'next year'], l2:['hace dos años', 'the year before last'], n2:['dentro de dos años', 'the year after next'] }[kind];
  const wr = [{ zh:yearQtyZh(ty) + '年', why:'yearQty' }, { zh:digitsZh(ty) + '個年', why:'ge' }];
  [-2, -1, 0, 1, 2].filter(x => x !== dy).forEach(x => wr.push({ zh:yearZh(y + x), why:x === 0 ? 'rel' : 'year' }));
  return Object.assign(base, {
    line:{ zh:word + '是幾年？', es:'¿Qué año es ' + tr[0] + '?', en:'What year is ' + tr[1] + '?' },
    options:mkOptions({ zh:ansZh, why:null }, wr), fb:{ ansZh, extra:fmtDate(y, m, d, true) } });
}

function tapQuestion(T, tg, zh, whenTrans, ev, past){
  const trEs = whenTrans[0] + ', ' + (past ? ev.esP : 'voy a ' + ev.es) + '.';
  const trEn = whenTrans[1] + ', ' + (past ? 'I ' + ev.enP : 'I’m going to ' + ev.en) + '.';
  return { id:'tap', kind:'tap',
    instr:L('請聽，然後點月曆上正確的日子，再按「確定」。', 'Escucha, toca el día correcto del calendario y pulsa «Confirmar».', 'Listen, tap the right day on the calendar, then press “Confirm”.'),
    line:null, visual:todayVisual(T, { mode:'pick' }), audio:zh, peek:zh, target:{ y:tg.y, m:tg.m, d:tg.d },
    fb:{ ansZh:monthZh(tg.m) + dayZh(tg.d, '號'), extra:fmtDate(tg.y, tg.m, tg.d, true), trans:{ es:trEs, en:trEn } } };
}
function gTapAbs(lv){
  const T = randToday(), ev = pick(EVENTS), N = dim(T.y, T.m);
  let d; do { d = randInt(1, N); } while (d === T.d);
  const past = d < T.d, st = pick(['日', '號']);
  const zh = monthZh(T.m) + dayZh(d, st) + '我' + (past ? ev.past : ev.fut);
  const q = tapQuestion(T, { y:T.y, m:T.m, d }, zh, ['El ' + fmtDate(T.y, T.m, d, false), 'On ' + fmtDate(T.y, T.m, d, false)], ev, past);
  q.id = 'tapAbs'; return q;
}
function gTapRelDay(lv){
  const T = randToday(), ev = pick(EVENTS), off = pick(lv === 'easy' ? [-1, 1] : [-2, -1, 1, 2]);
  const tg = addDays(T.y, T.m, T.d, off), past = off < 0, lt = REL_DAYS_L[String(off)];
  const zh = REL_DAYS[String(off)] + '我' + (past ? ev.past : ev.fut);
  const q = tapQuestion(T, tg, zh, [lt[0][0].toUpperCase() + lt[0].slice(1), lt[1][0].toUpperCase() + lt[1].slice(1)], ev, past);
  q.id = 'tapRelDay'; return q;
}
function gTapRelWeek(lv){
  for (let g = 0; g < 200; g++){
    const T = randToday(), ev = pick(EVENTS), wOff = pick(lv === 'easy' ? [0, 1] : [-1, 0, 1]), X = randInt(1, 5);
    if (wOff === 0 && X === T.w) continue;
    const tg = addDays(T.y, T.m, T.d, -((T.w + 6) % 7) + wOff * 7 + (X - 1));
    if (!sameMonth(T, tg)) continue;
    const past = (tg.d < T.d), zh = REL_WEEK[String(wOff)][0] + wkZh(X, '天') + '我' + (past ? ev.past : ev.fut);
    const q = tapQuestion(T, tg, zh, ['El ' + DAYS_ES[X] + ' de ' + REL_WEEK[String(wOff)][1], DAYS_EN[X] + ' ' + REL_WEEK[String(wOff)][2]], ev, past);
    q.id = 'tapRelWeek'; return q;
  }
  return gTapRelDay(lv);
}

const qSig = q => [q.id, q.line && q.line.zh, q.audio, JSON.stringify(q.visual), JSON.stringify(q.target), q.cards && q.cards.map(c => c.zh + '|' + c.slot).join(',')].join('#');
function makeQuestions(spec, lv, n){
  /* spec: 'all' 或 一串題型 id；lv: 'easy'|'mid'|'hard'|'mix'。同一回不出現題幹一樣的題目 */
  const ids = spec === 'all' ? ALL_IDS : spec;
  const out = [], seen = new Set(); let bag = [];
  while (out.length < n){
    if (!bag.length) bag = shuffle(ids);
    const id = bag.pop();
    const L2 = lv === 'mix' ? pick(['easy', 'mid', 'mid', 'hard']) : lv;
    let q = null;
    for (let t = 0; t < 30; t++){ q = GEN[id](L2); if (!seen.has(qSig(q))) break; }
    seen.add(qSig(q)); q.lv = L2; out.push(q);
  }
  return out;
}

let _ac = null;
function sfx(ok){
  try{
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    if (!_ac) _ac = new AC();
    if (_ac.state === 'suspended') _ac.resume();
    const t = _ac.currentTime, notes = ok ? [[660, 0], [880, 0.09]] : [[220, 0], [170, 0.12]];
    notes.forEach(([f, d]) => {
      const o = _ac.createOscillator(), g = _ac.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + d); g.gain.exponentialRampToValueAtTime(0.16, t + d + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.16);
      o.connect(g); g.connect(_ac.destination); o.start(t + d); o.stop(t + d + 0.18);
    });
  }catch(e){}
}

/* =====================  時鐘  ===================== */
function clockSVG(o){
  const { h, m, s } = o, hasS = s != null;
  const pt = (a, len) => { const r = a * Math.PI / 180; return [(100 + len * Math.sin(r)).toFixed(2), (100 - len * Math.cos(r)).toFixed(2)]; };
  let g = '<circle cx="100" cy="100" r="95" fill="#fbf8f0" stroke="#2b2a27" stroke-width="2"/>';
  for (let i = 0; i < 60; i++){
    const big = i % 5 === 0, a = i * 6, p1 = pt(a, 94), p2 = pt(a, big ? 85 : 90);
    g += `<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" stroke="#2b2a27" stroke-width="${big ? 2 : 1}"/>`;
  }
  let nums = '';
  for (let n = 1; n <= 12; n++){ const p = pt(n * 30, 70); nums += `<text x="${p[0]}" y="${p[1]}" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#2b2a27" stroke="#fbf8f0" stroke-width="3" paint-order="stroke" font-family="system-ui,sans-serif">${n}</text>`; }
  const hA = (h % 12) * 30 + m * 0.5 + (hasS ? s / 120 : 0), mA = m * 6 + (hasS ? s * 0.1 : 0);
  const hp = pt(hA, 48), mp = pt(mA, 74);
  g += nums;
  g += `<line class="hh" x1="100" y1="100" x2="${hp[0]}" y2="${hp[1]}" stroke="#2b2a27" stroke-width="6" stroke-linecap="round"/>`;
  g += `<line class="mh" x1="100" y1="100" x2="${mp[0]}" y2="${mp[1]}" stroke="#2b2a27" stroke-width="3.5" stroke-linecap="round"/>`;
  if (hasS){
    const sp = pt(s * 6, 82), st = pt(s * 6 + 180, 16);
    g += `<line x1="${st[0]}" y1="${st[1]}" x2="${sp[0]}" y2="${sp[1]}" stroke="#a8503c" stroke-width="1.6" stroke-linecap="round"/>`;
  }
  g += `<circle cx="100" cy="100" r="4.5" fill="${hasS ? '#a8503c' : '#2b2a27'}"/>`;
  return `<svg viewBox="0 0 200 200" class="clock${o.mini ? ' mini' : ''}" ${o.dial ? 'id="dial"' : ''} role="img" aria-label="clock">${g}</svg>`;
}
function setHands(svg, h, m){
  const pt = (a, len) => { const r = a * Math.PI / 180; return [(100 + len * Math.sin(r)).toFixed(2), (100 - len * Math.cos(r)).toFixed(2)]; };
  const hp = pt((h % 12) * 30 + m * 0.5, 48), mp = pt(m * 6, 74), hh = $('.hh', svg), mh = $('.mh', svg);
  hh.setAttribute('x2', hp[0]); hh.setAttribute('y2', hp[1]); mh.setAttribute('x2', mp[0]); mh.setAttribute('y2', mp[1]);
}
function bindDial(svg, st, readout){
  let drag = null;
  const ang = e => {
    const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 200 - 100, y = (e.clientY - r.top) / r.height * 200 - 100;
    let a = Math.atan2(x, -y) * 180 / Math.PI; if (a < 0) a += 360;
    return { a, r:Math.hypot(x, y) };
  };
  const apply = p => {
    if (drag === 'm') st.m = Math.round(p.a / 6) % 60;
    else { let hh = Math.round((p.a - st.m * 0.5) / 30); hh = ((hh % 12) + 12) % 12; st.h = hh === 0 ? 12 : hh; }
    setHands(svg, st.h, st.m); if (readout) readout.textContent = digital(st.h, st.m);
  };
  svg.addEventListener('pointerdown', e => { if (App.answered) return; const p = ang(e); drag = p.r > 60 ? 'm' : 'h'; try{ svg.setPointerCapture(e.pointerId); }catch(err){} apply(p); e.preventDefault(); });
  svg.addEventListener('pointermove', e => { if (drag && !App.answered) apply(ang(e)); });
  const end = () => { drag = null; };
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
}

function ycalHTML(v){

  if (!ok && chosen && chosen.why && WHY[chosen.why]) h += `<div class="why">${Lh(WHY[chosen.why])}</div>`;
  if (extraHTML) h += extraHTML;
  if (!ok) h += `<div class="small" style="margin-top:8px">${Li(STR.correctIs)}</div>`;
  h += `<div class="ans">${lineHTML(q.fb.ansZh)}</div>`;
  if (q.fb.extra) h += `<div class="small">${esc(q.fb.extra)}</div>`;
  if (q.fb.trans){ const t = Settings.lang === 'es' ? q.fb.trans.es : Settings.lang === 'en' ? q.fb.trans.en : ''; if (t) h += `<div class="small">${esc(t)}</div>`; }
  h += '</div>';
  $('#fb').innerHTML = h;
  $('#home').nextElementSibling.nextElementSibling.querySelector('b').textContent = App.score;
  const last = App.i >= App.qs.length - 1, nb = $('#next');
  nb.innerHTML = Lh(last ? STR.seeResult : STR.next); nb.hidden = false;
  nb.onclick = () => { if (last) showResult(); else { App.i++; renderQ(); } };
  const cf = $('#confirm'); if (cf) cf.disabled = true;
  /* 解答條固定在螢幕底部：上面的題目、時鐘、選項完全不動，也不自動捲動 */
  const sh = $('#sheet'); sh.hidden = false; document.body.classList.add('has-sheet');
  document.documentElement.style.setProperty('--sheet-h', (sh.offsetHeight + 16) + 'px');
}

function answerChoice(i){
  if (App.answered) return;
  const q = App.cur, o = q.options[i];
  $$('.opt').forEach((b, k) => { b.disabled = true; if (q.options[k].ok) b.classList.add('ok'); else if (k === i) b.classList.add('bad'); });
  showFeedback(!!o.ok, q, o);
}
function answerDial(){
  if (App.answered) return;
  const q = App.cur, st = App.dial, tg = q.target;
  const dm = Math.abs(st.m - tg.m), diff = Math.min(dm, 60 - dm);
  const ok = st.h === tg.h && diff <= 2;
  const mine = digital(st.h, st.m);
  showFeedback(ok, q, ok ? null : { d:mine, why:null }, `<div style="text-align:center">${clockSVG({ h:tg.h, m:tg.m, mini:true })}</div>`);
}

/* ---------- 月曆點選 ---------- */
function bindCal(q){
  const v = q.visual;
  $$('.cal td[data-d]').forEach(td => td.addEventListener('click', () => {
    const d = +td.dataset.d;
    if (v.mode === 'view'){
      const det = v.details[d], box = $('#detail');
      if (!box) return;
      $$('.cal td').forEach(x => x.classList.remove('sel')); td.classList.add('sel');
      if (!det){ box.innerHTML = `<span class="small">${esc(zhOf(STR.noPlan))}</span>`; return; }
      const t = trOf(det.gloss);
      box.innerHTML = `<div>${lineHTML(det.head)}</div><div>${lineHTML(det.body)}</div>${t ? `<span class="small">${esc(t)}</span>` : ''}`;
      return;
    }
    if (App.answered) return;
    $$('.cal td').forEach(x => x.classList.remove('sel')); td.classList.add('sel');
    App.sel = d; $('#confirm').disabled = false;
  }));
  if (q.kind === 'tap') $('#confirm').addEventListener('click', answerTap);
}
function answerTap(){
  if (App.answered || App.sel == null) return;
  const q = App.cur, tg = q.target, ok = App.sel === tg.d;
  $$('.cal td[data-d]').forEach(td => { td.classList.remove('sel'); if (+td.dataset.d === tg.d) td.classList.add('good'); else if (!ok && +td.dataset.d === App.sel) td.classList.add('wrong'); });
  showFeedback(ok, q, ok ? null : { d:fmtDate(tg.y, tg.m, App.sel, false), why:'tap' });
}

/* ---------- 行程配對 ---------- */
function initMatch(q){
  App.match = { placed:q.slots.map(() => null), selCard:null };
  drawMatch(q);
  $('#confirm').addEventListener('click', answerMatch);
}
function drawMatch(q){
  const st = App.match, done = App.answered;
  $('#slots').innerHTML = q.slots.map((s, i) => {
    const ci = st.placed[i], card = ci != null ? q.cards[ci] : null;
    return `<div class="slot"><div class="tm">${esc(s.label)}</div><div class="box${card ? ' filled' : ''}${done && card ? (card.slot === i ? ' ok' : ' bad') : ''}" data-slot="${i}">${card ? lineHTML(card.zh) : ''}</div></div>`;
  }).join('');
  $('#cards').innerHTML = q.cards.map((c, i) => {
    const used = st.placed.includes(i), t = trOf(c.gloss);
    return `<button class="cardb${st.selCard === i ? ' sel' : ''}${used ? ' used' : ''}" data-card="${i}"${used || done ? ' disabled' : ''}>${lineHTML(c.zh)}${t ? `<span class="tr">${esc(t)}</span>` : ''}</button>`;
  }).join('');
  if (!done){
    $$('[data-card]').forEach(b => b.addEventListener('click', () => { st.selCard = st.selCard === +b.dataset.card ? null : +b.dataset.card; drawMatch(q); }));
    $$('[data-slot]').forEach(b => b.addEventListener('click', () => {
      const i = +b.dataset.slot;
      if (st.selCard != null){ const prev = st.placed[i]; st.placed[i] = st.selCard; st.selCard = null; void prev; }
      else if (st.placed[i] != null) st.placed[i] = null;
      drawMatch(q);
    }));
    $('#confirm').disabled = st.placed.some(x => x == null);
  }
}
function answerMatch(){
  if (App.answered) return;
  const q = App.cur, st = App.match;
  const ok = st.placed.every((ci, i) => ci != null && q.cards[ci].slot === i);
  showFeedback(ok, q, null);     // 這裡會把 App.answered 設成 true
  drawMatch(q);                  // 再重畫一次，把對錯的顏色畫出來
}

/* =====================  結果與排行榜  ===================== */
function localBest(){ try{ return +localStorage.getItem('timegame.best') || 0; }catch(e){ return 0; } }
function showResult(){
  const r = App.round, n = App.qs.length, max = n * 10, ratio = App.score / max;
  const msg = ratio >= 0.9 ? L('太棒了！', '¡Excelente!', 'Excellent!') : ratio >= 0.7 ? L('很好！', '¡Muy bien!', 'Well done!') : ratio >= 0.5 ? L('不錯，再練習一下。', 'Bien, practica un poco más.', 'Good, keep practicing.') : L('再試一次，你可以的！', 'Inténtalo otra vez, ¡puedes!', 'Try again, you can do it!');
  if (App.score > localBest() && r.isMix){ try{ localStorage.setItem('timegame.best', String(App.score)); }catch(e){} }
  let h = `<div class="card result"><div class="small">${esc(sc(r.isMix ? '綜合挑戰' : '練習完成'))}</div><div class="score">${App.score}<span class="small"> / ${max}</span></div><div class="msg">${Lh(msg)}</div><div class="small">${App.right} / ${n}</div></div>`;
  if (r.isMix) h += `<div class="card"><div class="note">${Li(STR.best)}：${localBest()}</div></div>`;
  h += `<div class="row" style="justify-content:center"><button class="btn primary" id="again">${Lh(STR.again)}</button><button class="btn" id="home2">${Lh(STR.home)}</button></div>`;
  document.body.classList.remove('has-sheet');
  root().innerHTML = h; window.scrollTo(0, 0);
  $('#again').addEventListener('click', () => startRound(r.spec, r.lv, r.label, r.isMix));
  $('#home2').addEventListener('click', renderStart);
}
renderStart();

</script>
<script>
/* ===== 找不到中文聲音的提示（每天一分鐘遊戲統一做法）===== */
(function(){
  var shown=false;
  function cfg(){ var s={}; try{ s=JSON.parse(localStorage.getItem('hanziGames.settings')||'{}')||{}; }catch(e){} return s; }
  function isMandarin(v){ var l=String((v&&v.lang)||'').toLowerCase().replace(/_/g,'-'); if(l.indexOf('yue')===0||l.indexOf('zh-hk')===0) return false; return l==='zh'||l.indexOf('zh-')===0||l.indexOf('cmn')===0; }
  var T={
    none:{ zh:['這個裝置找不到中文（台灣）語音，聽不到念的內容。請到手機設定安裝「中文（台灣）」語音，或換一個裝置。','这个装置找不到中文（台湾）语音，听不到念的内容。请到手机设置安装「中文（台湾）」语音，或换一个装置。'],
           es:'No se encontró una voz de chino (Taiwán) en este dispositivo, así que no se oirá el audio. Instala la voz «chino (Taiwán)» en los ajustes del móvil o usa otro dispositivo.',
           en:'No Chinese (Taiwan) voice was found on this device, so you won’t hear the audio. Install the “Chinese (Taiwan)” voice in your phone settings, or use another device.' },
    nosynth:{ zh:['這個瀏覽器不支援語音，聽不到念的內容。請換一個瀏覽器（例如 Chrome、Safari）。','这个浏览器不支持语音，听不到念的内容。请换一个浏览器（例如 Chrome、Safari）。'],
           es:'Este navegador no admite voz, así que no se oirá el audio. Usa otro navegador (por ejemplo Chrome o Safari).',
           en:'This browser does not support speech, so you won’t hear the audio. Try another browser (for example Chrome or Safari).' }
  };
  function show(kind){
    if(shown||document.getElementById('hgVoiceHint')) return; shown=true;
    var s=cfg(), lang=s.lang||'es', simp=s.script==='simp', t=T[kind];
    var st=document.createElement('style');
    st.textContent='#hgVoiceHint{position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:2147482999;width:min(94vw,520px);box-sizing:border-box;display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:12px;background:#fff6dc;border:1px solid #d8b24a;color:#5b4410;font:13px/1.4 system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.25)}#hgVoiceHint .m{flex:1}#hgVoiceHint .m small{display:block;font-size:11px;opacity:.85;margin-top:2px}#hgVoiceHint button{border:0;background:transparent;color:inherit;font-size:16px;line-height:1;padding:0 2px;cursor:pointer}';
    document.head.appendChild(st);
    var d=document.createElement('div'); d.id='hgVoiceHint'; d.setAttribute('role','status');
    var m=document.createElement('div'); m.className='m';
    var zh=document.createElement('div'); zh.textContent = simp ? t.zh[1] : t.zh[0]; m.appendChild(zh);
    if(lang!=='zh'){ var sm=document.createElement('small'); sm.textContent = lang==='en' ? t.en : t.es; m.appendChild(sm); }
    var x=document.createElement('button'); x.type='button'; x.textContent='✕'; x.setAttribute('aria-label','Close');
    x.addEventListener('click',function(){ d.remove(); });
    d.appendChild(m); d.appendChild(x); document.body.appendChild(d);
  }
  function check(){
    try{
      if(!window.speechSynthesis){ show('nosynth'); return; }
      var vs=window.speechSynthesis.getVoices()||[];
      if(vs.length && !vs.some(isMandarin)) show('none');   // 清單是空的時（有些手機一開始就是空的）先不判斷
    }catch(e){}
  }
  function start(){
    check();
    try{ window.speechSynthesis.addEventListener('voiceschanged', check); }catch(e){}
    setTimeout(check,1500); setTimeout(check,4000);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
/* ===== /找不到中文聲音的提示 ===== */

</script>
